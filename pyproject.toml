[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyroast"
version = "0.1.0"
description = "High-Performance OAST Subdomain Decoder"
readme = "README.md"
authors = [{name = "Michael Reeves", email = "mastermjr@mastermjr.com"}]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["pandas"]
keywords = ["oast", "subdomain", "security", "decoder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/mastermjr/pyroast"
Repository = "https://github.com/mastermjr/pyroast"
